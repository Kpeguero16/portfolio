<!doctype html>
<!-- Source of og.png, the 1200×630 link-preview image. To rebuild it from the repo root:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=5000 --screenshot=og.png scripts/og-image.html
     The blocks are real merged PRs, so the image stays true as the list grows. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --paper: #f3efe6; --card: #fffdf8; --ink: #17150f; --ink-2: #5b564a; --line: #ddd5c3; --orange: #ff5a1f; --blue: #2f6afc; --green: #17a05d; --violet: #785afa; --yellow: #ffc933; --chore: #f7f2e7 }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased }
  .card { position: relative; width: 1200px; height: 630px; padding: 70px 76px; box-sizing: border-box; font-family: "Bricolage Grotesque", sans-serif }
  .eyebrow { font: 500 23px "IBM Plex Mono", monospace; color: var(--ink-2); display: flex; align-items: center; gap: 14px; margin: 0 }
  .eyebrow i { width: 14px; height: 14px; border-radius: 4px; background: var(--orange); transform: rotate(45deg) }
  h1 { font-size: 132px; line-height: .95; letter-spacing: -.04em; font-weight: 750; margin: 26px 0 0; font-variation-settings: "opsz" 96; white-space: nowrap }
  p.lede { font-size: 32px; line-height: 1.35; color: var(--ink-2); margin: 24px 0 0; max-width: 900px }
  p.lede b { color: var(--ink); font-weight: 600 }
  .url { position: absolute; right: 76px; top: 64px; font: 500 20px "IBM Plex Mono", monospace; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px }
  .blk { position: absolute; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px; box-sizing: border-box; height: 54px; border-radius: 15px;
    font: 500 17px "IBM Plex Mono", monospace; color: #fff; background: var(--dot);
    box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 -4px 0 rgba(0,0,0,.14) inset, 0 10px 18px -10px rgba(40,30,10,.45) }
  .blk .bt { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; opacity: .9 }
  .FEAT .bt, .REFACTOR .bt { opacity: 1 }
  .FIX { --dot: var(--orange) } .FEAT { --dot: var(--blue) } .TEST { --dot: var(--green) } .REFACTOR { --dot: var(--violet) } .DOCS { --dot: var(--yellow) }
  .CHORE { --dot: var(--chore); border: 1px solid var(--line) }
  .CHORE, .DOCS, .FIX, .TEST { color: var(--ink) } .CHORE .bt { opacity: .75 }
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow"><i></i>Software engineer · Swarms · CS at FIU '27</p>
  <h1>Khalil Peguero</h1>
  <p class="lede">I build backend and multi-agent systems.<br>Every block is a PR I merged into <b>Swarms</b>.</p>
  <span class="url">khalilpeguero.me/portfolio</span>
</div>
<script>
// [number, type, x, y, rotation in degrees, width]; a settled pile along the bottom edge, like the hero after the rain.
const pile = [
  [3216, 'REFACTOR', 18, 576, -3, 170], [400, 'DOCS', 200, 578, 2, 150], [3213, 'FIX', 362, 574, -2, 150],
  [3214, 'TEST', 524, 577, 3, 170], [3192, 'FIX', 706, 575, -1, 160], [391, 'DOCS', 878, 578, 2, 150],
  [3191, 'REFACTOR', 1040, 576, -3, 170],
  [3212, 'CHORE', 120, 522, 7, 150], [388, 'DOCS', 452, 520, -8, 150], [3194, 'TEST', 790, 522, 6, 170],
  [3195, 'CHORE', 1062, 468, -74, 150],
];
for (const [n, type, x, y, rot, w] of pile) {
  const el = document.createElement('div');
  el.className = `blk ${type}`;
  el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;transform:rotate(${rot}deg)`;
  el.innerHTML = `<span>#${n}</span><span class="bt">${type === 'DOCS' ? 'docs' : type.toLowerCase()}</span>`;
  document.querySelector('.card').appendChild(el);
}
</script>
</body>
</html>
